[padding]
before = 0
after = 0

[data]
versions = "versions.json"

[exclude]
patterns = [
  "AGENTS.md",
  "docs/agents/**",
  "**/.dart_tool/**",
  "**/build/**",
  "**/coverage/**",
  "**/.git/**",
  # Dart doc comments are synced by scripts/sync_dart_doc_comments.dart, which
  # adds the `///` prefix; mdt 0.9.6 started scanning `.dart` files itself.
  "**/*.dart",
]
markdown_codeblocks = true
