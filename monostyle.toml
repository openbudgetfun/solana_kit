# monostyle's configuration for this repository.
#
# `fail-under` is a ratchet, not a destination: the floors sit just under the
# score at onboarding, so the gate enforces non-regression from the first run
# and is tightened as the findings it names are remediated.
[rules]
max-line-width = 120

[rules.ignore]
# Sample applications demonstrate a technique end to end and are edited far
# less often than the packages they accompany.
patterns = [
  "examples/**",
  "docs/site/**",
  "CHANGELOG.md",
  "**/CHANGELOG.md",
]
