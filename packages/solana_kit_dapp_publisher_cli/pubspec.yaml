name: solana_kit_dapp_publisher_cli
description: Portal-backed CLI for publishing dApp versions to the Solana Mobile dApp Store.
version: 0.0.0
repository: https://github.com/openbudgetfun/solana_kit/tree/main/packages/solana_kit_dapp_publisher_cli
homepage: https://openbudgetfun.github.io/solana_kit/
environment:
  sdk: ^3.12.0
resolution: workspace
executables:
  dapp-store: dapp_store

dependencies:
  http: ^1.4.0
  solana_kit_address_constants: ^0.9.1
  solana_kit_addresses: ^0.9.1
  solana_kit_keys: ^0.9.1
  solana_kit_mpl_token_metadata: ^0.9.1
  solana_kit_rpc: ^0.9.1
  solana_kit_rpc_spec: ^0.9.1
  solana_kit_signers: ^0.9.1
  solana_kit_transaction_messages: ^0.9.1
  solana_kit_transactions: ^0.9.1

dev_dependencies:
  solana_kit_lints: ^0.9.1
  test: ^1.25.0
