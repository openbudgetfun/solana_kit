name: changeset-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: changeset-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !startsWith(github.head_ref, 'monochange/release/') }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: collect changed files
        id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47

      - name: reject group-targeted changesets
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          set -euo pipefail

          changesets=()
          for path in $CHANGED_FILES; do
            if [[ "$path" == .changeset/*.md ]]; then
              changesets+=("$path")
            fi
          done

          if (( ${#changesets[@]} > 0 )); then
            dart run scripts/check_changeset_package_targets.dart "${changesets[@]}"
          else
            echo "No changed changeset files to validate."
          fi
        shell: devenv shell -- bash -e {0}

      - name: check changeset policy
        uses: monochange/actions/changeset-policy@4c881e8caf28056185bc5ff854eab100f880a0e9 # v0.9.2
        with:
          setup-monochange: devenv shell monochange
          changed-paths: ${{ steps.changed.outputs.all_changed_files }}
          labels: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
