name: publish

# Publishes every configured package and creates the GitHub releases.
#
# Trusted publishing (OIDC) pins the run identity, and pub.dev rejects any
# token whose run ref is not `refs/tags/<tag-pattern>` — for push and
# workflow_dispatch events alike. Each run therefore resolves the single
# MonoChange release target identified by its tag and publishes only that
# target's packages. The primary `v*` tag starts on push; dispatch this
# workflow on each scoped tag to publish independently versioned targets:
#
#   gh workflow run publish.yml --ref solana_kit_system/v0.8.0 \
#     -f tag=solana_kit_system/v0.8.0
#
# Every pub.dev package must enable publishing from `workflow_dispatch` and
# use the exact tag pattern of its MonoChange release target. A dispatch from a
# branch ref never receives a publishable pub.dev OIDC identity.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description:
          "Release tag to publish (for example v0.1.0 or
          solana_kit_system/v0.8.0). Dispatch on the same tag ref with
          `gh workflow run publish.yml --ref <tag>` so pub.dev trusted
          publishing accepts the run."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'openbudgetfun/solana_kit'
    environment: publisher
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* && "$RELEASE_TAG" != */v* ]] || [[ "$RELEASE_TAG" == */*/* ]]; then
            echo "::error::Tag '$RELEASE_TAG' must be a v* release tag, optionally scoped as <name>/v*." >&2
            exit 1
          fi
        shell: bash

      - name: checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: verify tag checkout
        env:
          EXPECTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected_tag="$EXPECTED_TAG"
          actual_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n1 "$expected_tag")"
          if [ "$actual_commit" != "$tag_commit" ]; then
            echo "::error::Checked-out commit $actual_commit does not match tag $expected_tag ($tag_commit)." >&2
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main --tags
          if ! git merge-base --is-ancestor "$actual_commit" refs/remotes/origin/main; then
            echo "::error::Tag $expected_tag ($actual_commit) is not on main." >&2
            exit 1
          fi
        shell: bash

      - name: resolve release target
        id: release_target
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          mapfile -t changed_release_files < <(
            git diff-tree --no-commit-id --name-only -r HEAD -- .monochange/releases
          )
          release_records=()
          for changed_file in "${changed_release_files[@]}"; do
            case "$changed_file" in
              .monochange/releases/*/release.json) release_records+=("$changed_file") ;;
            esac
          done
          if [ "${#release_records[@]}" -ne 1 ]; then
            echo "::error::Expected one release record written by the tagged commit, found ${#release_records[@]}." >&2
            exit 1
          fi
          target_record="${release_records[0]}"
          target="$(
            git show "HEAD:$target_record" | jq -ce --arg tag "$RELEASE_TAG" '
              [.release_targets?[] | select(.tag_name == $tag)] |
              if length == 1 then .[0] else error("expected one release target") end
            '
          )"

          target_kind="$(jq -r '.kind' <<<"$target")"
          target_id="$(jq -r '.id' <<<"$target")"
          case "$target_kind" in
            group|package) ;;
            *)
              echo "::error::Release tag $RELEASE_TAG resolved to unsupported target kind $target_kind." >&2
              exit 1
              ;;
          esac
          if [ -z "$target_id" ] || [ "$target_id" = "null" ]; then
            echo "::error::Release tag $RELEASE_TAG has no target identifier." >&2
            exit 1
          fi

          jq -r '.members[]' <<<"$target" > "$RUNNER_TEMP/publish-target-packages"
          if [ ! -s "$RUNNER_TEMP/publish-target-packages" ]; then
            echo "::error::Release tag $RELEASE_TAG has no target packages." >&2
            exit 1
          fi

          {
            echo "kind=$target_kind"
            echo "id=$target_id"
            echo "record=$target_record"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $target_kind $target_id from $target_record:"
          cat "$RUNNER_TEMP/publish-target-packages"

      - name: setup Dart publishing authentication
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Keep registry-url unset so setup-node does not inject NODE_AUTH_TOKEN;
      # MonoChange requires token-free npm OIDC trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: capture action-managed Node path
        id: action_tools
        run: |
          set -euo pipefail
          node_dir="$(dirname "$(command -v node)")"
          echo "node_dir=$node_dir" >> "$GITHUB_OUTPUT"
          echo "node: $node_dir/node"
          echo "npm: $node_dir/npm"

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install NPM dependencies
        run: pnpm install --frozen-lockfile

      - name: build NPM renderer package
        run: pnpm --filter codama-renderers-dart build

      - name: check publish readiness
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          mapfile -t target_packages < "$RUNNER_TEMP/publish-target-packages"
          target_args=()
          for package_name in "${target_packages[@]}"; do
            target_args+=(--package "$package_name")
          done
          monochange step publish-readiness \
            --from HEAD \
            "${target_args[@]}" \
            --output "$RUNNER_TEMP/publish-readiness.json" \
            --format json
        shell: devenv shell -- bash -e {0}

      - name: publish packages with MonoChange
        env:
          ACTION_NODE_DIR: ${{ steps.action_tools.outputs.node_dir }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          # devenv can place its own Node.js ahead of setup-node. npm trusted
          # publishing requires Node.js 22.14+ and npm 11.5.1+.
          export PATH="$ACTION_NODE_DIR:$PATH"
          hash -r
          command -v node
          command -v npm
          command -v dart
          command -v flutter
          node --version
          npm --version
          dart --version
          flutter --version
          # pub.dev validates the run ref inside the OIDC token and rejects
          # every token whose ref is not `refs/tags/<tag-pattern>`, for push
          # and workflow_dispatch events alike. Skip dart on non-tag runs
          # instead of failing late with an opaque registry authorization
          # error; dispatch on the release tag to publish dart.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            ecosystems=(--ecosystem npm --ecosystem dart)
          else
            ecosystems=(--ecosystem npm)
            echo "::warning::skipping dart/pub.dev publishing: this run ref is ${GITHUB_REF}, not a tag, and pub.dev trusted publishing only accepts tag refs. Dispatch on the release tag instead: gh workflow run publish.yml --ref <tag>"
          fi
          mapfile -t target_packages < "$RUNNER_TEMP/publish-target-packages"
          target_args=()
          for package_name in "${target_packages[@]}"; do
            target_args+=(--package "$package_name")
          done
          monochange step publish-packages \
            --log-level info \
            "${target_args[@]}" \
            "${ecosystems[@]}" \
            --output "$RUNNER_TEMP/publish-result.json" \
            --format json
        shell: devenv shell -- bash -e {0}

      - name: publish GitHub releases
        # MonoChange creates the release objects from the complete release
        # record. Run it once from the primary group tag rather than for each
        # independently dispatched pub.dev target.
        if: steps.release_target.outputs.kind == 'group' && steps.release_target.outputs.id == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          monochange step publish-release \
            --from-ref HEAD \
            --format json | tee "$RUNNER_TEMP/publish-release.json"
        shell: devenv shell -- bash -e {0}

      - name: upload MonoChange publish artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monochange-publish-artifacts
          path: |
            ${{ runner.temp }}/publish-readiness.json
            ${{ runner.temp }}/publish-result.json
            ${{ runner.temp }}/publish-release.json
          if-no-files-found: ignore
          retention-days: 14
