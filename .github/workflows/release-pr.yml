name: release-pr

# MonoChange release automation, review-first, modelled on ifiokjr/monosecret:
#
# 1. Pushes to `main` (and manual dispatches) prepare the pending changesets
#    with MonoChange, update package versions, changelogs, lockfiles, and
#    release docs, then open or update the `chore(release): prepare release`
#    pull request against `main` (see [source.pull_requests] in
#    `monochange.toml`).
# 2. When that release pull request is merged, HEAD becomes a MonoChange
#    release commit. The tag job then creates and pushes the full release tag
#    set from the release record (the primary `v*` tag plus scoped `<id>/v*`
#    tags for independently versioned targets), creates draft GitHub releases
#    for those tags, and comments on the released issues.
# 3. The `publish` workflow runs for the primary `v*` tag: it publishes every
#    version group under its own tag and flips the draft releases once all
#    packages are on their registries.
#
# The tag job pushes tags with `RELEASE_PR_MERGE_TOKEN` (a PAT) so the tag
# push fires the publish workflow, exactly like monosecret. When that secret
# is not configured, the job falls back to `GITHUB_TOKEN` for git pushes and
# dispatches the publish workflow explicitly instead (GITHUB_TOKEN tag pushes
# do not fire workflow events).

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create:
    if: github.repository == 'openbudgetfun/solana_kit'
    outputs:
      is_release_commit: ${{ steps.release_record.outputs.is_release_commit }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: capture action-managed tool paths
        id: action_tools
        shell: bash
        run: |
          set -euo pipefail
          node_dir="$(dirname "$(command -v node)")"
          pnpm_dir="$(dirname "$(command -v pnpm)")"
          echo "node_dir=$node_dir" >> "$GITHUB_OUTPUT"
          echo "pnpm_dir=$pnpm_dir" >> "$GITHUB_OUTPUT"
          echo "node: $node_dir/node"
          echo "pnpm: $pnpm_dir/pnpm"

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure release git credentials
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GH_TOKEN="$RELEASE_PR_TOKEN"
          gh auth setup-git
        shell: devenv shell -- bash -e {0}

      - name: refresh tags from origin
        run: git fetch --force --tags origin
        shell: devenv shell -- bash -e {0}

      - name: detect current release commit
        id: release_record
        run: |
          set -euo pipefail

          release_record_error="$(mktemp)"
          if is_release_commit="$(monochange --log-level=debug step release-record --from HEAD --format json --jq '.resolved_commit == .record_commit' 2>"$release_record_error")"; then
            echo "is_release_commit=${is_release_commit}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject="$(git log -1 --pretty=%s)"
          body="$(git log -1 --pretty=%B)"
          if [[ "$subject" == chore\(release\):\ prepare\ release* ]] || grep -q '<!-- monochange:release-record:start -->' <<<"$body"; then
            echo "::error::Release-looking commit could not be read as a release record; failing instead of silently skipping release automation." >&2
            cat "$release_record_error" >&2
            exit 1
          fi

          echo "is_release_commit=false" >> "$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

      - name: detect pending changesets
        id: pending_changesets
        if: steps.release_record.outputs.is_release_commit != 'true'
        run: |
          set -euo pipefail
          has_changesets=false
          if [ -d .changeset ] && find .changeset -type f -name '*.md' -print -quit | grep -q .; then
            has_changesets=true
          fi
          echo "has_changesets=${has_changesets}" >> "$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

      - name: refresh release pull request
        if: steps.release_record.outputs.is_release_commit != 'true' && steps.pending_changesets.outputs.has_changesets == 'true'
        env:
          ACTION_NODE_DIR: ${{ steps.action_tools.outputs.node_dir }}
          ACTION_PNPM_DIR: ${{ steps.action_tools.outputs.pnpm_dir }}
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep PrepareRelease and CommitRelease in one MonoChange process, while
          # forcing GitHub action-managed pnpm and Node ahead of the Nix profile.
          if [ -n "${ACTION_NODE_DIR:-}" ]; then
            export PATH="$ACTION_NODE_DIR:$PATH"
          fi
          if [ -n "${ACTION_PNPM_DIR:-}" ]; then
            export PATH="$ACTION_PNPM_DIR:$PATH"
          fi
          hash -r
          command -v node
          command -v pnpm
          node --version
          pnpm --version
          export GH_TOKEN="$RELEASE_PR_TOKEN"
          # A changeset that only bumps private packages produces no releaseable
          # packages; monochange exits non-zero with that message. Treat that
          # specific case as "nothing to release" rather than failing the
          # workflow, so such a changeset can sit until a releaseable one
          # arrives. Any other failure is re-raised.
          if ! output="$(monochange --log-level=debug run release --format json --commit --no-verify=true 2>&1)"; then
            if printf '%s\n' "$output" | grep -q 'no releaseable packages were found in discovered changesets'; then
              echo "No releaseable packages in current changesets; skipping release PR refresh."
              exit 0
            fi
            printf '%s\n' "$output" >&2
            exit 1
          fi
          printf '%s\n' "$output"
          monochange --log-level=debug step open-release-request --stage-all --no-verify
        shell: devenv shell -- bash -e {0}

      - name: skip refresh without changesets
        if: steps.release_record.outputs.is_release_commit != 'true' && steps.pending_changesets.outputs.has_changesets != 'true'
        run: echo "No pending changesets found; skipping release PR refresh."

      - name: skip refresh on merged release commit
        if: steps.release_record.outputs.is_release_commit == 'true'
        run: echo "HEAD is already a merged release commit; skipping release PR refresh."

  tag:
    if: github.repository == 'openbudgetfun/solana_kit' && needs.create.outputs.is_release_commit == 'true'
    needs: create
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
    steps:
      - name: checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure release git credentials
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_MERGE_TOKEN != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GH_TOKEN="$RELEASE_PR_TOKEN"
          gh auth setup-git
          if [ "$HAS_RELEASE_PR_TOKEN" != "true" ]; then
            echo "::warning::RELEASE_PR_MERGE_TOKEN is not configured; release tags are pushed with GITHUB_TOKEN, whose pushes do not fire workflow events. The publish workflow will be dispatched explicitly instead." >&2
          fi
        shell: devenv shell -- bash -e {0}

      - name: create release tags
        id: tag_release
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_MERGE_TOKEN != '' }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$RELEASE_PR_TOKEN"
          monochange --log-level=debug step tag-release --from HEAD --push=true --format json
          if [ "$HAS_RELEASE_PR_TOKEN" = "true" ]; then
            echo "use_push_trigger=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_push_trigger=false" >> "$GITHUB_OUTPUT"
          fi
        shell: devenv shell -- bash -e {0}

      - name: create draft releases
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$RELEASE_PR_TOKEN"
          monochange --log-level=debug step publish-release --from-ref="HEAD" --draft --format json
        shell: devenv shell -- bash -e {0}

      - name: comment on released issues
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$RELEASE_PR_TOKEN"
          monochange --log-level=debug step comment-released-issues --from-ref="HEAD" --auto-close-issues
        shell: devenv shell -- bash -e {0}

      - name: dispatch the publish workflow
        if: steps.tag_release.outputs.use_push_trigger != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          monochange --log-level=debug step release-record --from HEAD --format json \
            > "$RUNNER_TEMP/release-record.json"
          primary_tag="$(jq -r '([.record.release_targets[] | select(.kind == "group" and .version_format == "primary" and .tag_name)][0].tag_name // [.record.release_targets[] | select(.tag_name)][0].tag_name // empty)' "$RUNNER_TEMP/release-record.json")"
          if [ -z "$primary_tag" ]; then
            echo "::error::The release record has no tagged release target; cannot dispatch the publish workflow." >&2
            exit 1
          fi
          echo "Dispatching the publish orchestrator for ${primary_tag}"
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$primary_tag" \
            -f "tag=$primary_tag"
        shell: devenv shell -- bash -e {0}
