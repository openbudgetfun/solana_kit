name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: ".github/workflows/ .github/actions/"
          advanced-security: true
          online-audits: false

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve docs base path
        id: base
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_owner="${GITHUB_REPOSITORY%%/*}"

          if [[ "$repo_name" == "$repo_owner.github.io" ]]; then
            base_path='/'
          else
            base_path="/$repo_name/"
          fi

          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
          echo "Using DOCS_BASE_PATH=$base_path"
        shell: bash
      - name: Build and smoke test docs site
        env:
          DOCS_BASE_PATH: ${{ steps.base.outputs.base_path }}
        run: docs:site:smoke
        shell: devenv shell -- bash -e {0}

  upstream-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check tracked upstream parity metadata and behavior
        run: upstream:parity --clone-if-missing
        shell: devenv shell -- bash -e {0}

      # Runs after the clone above so the upstream codes file exists. The
      # local `docs:check` skips this when .repos/ is absent.
      - name: Check error-code number parity with upstream
        run: dart run scripts/check_error_code_parity.dart
        shell: devenv shell -- bash -e {0}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: lint all (includes ktlint and zizmor)
        run: lint:all
        shell: devenv shell -- bash -e {0}

      - name: monostyle inline annotations
        if: always()
        run: monostyle check . --format github
        shell: devenv shell -- bash -e {0}

      - name: Validate monochange configuration
        run: monochange step validate
        shell: devenv shell -- bash -e {0}

  # Lint the tree a release would actually publish, not the tree as it sits on
  # the branch.
  #
  # Some lints are version-sensitive: `remove_deprecations_in_breaking_versions`
  # only fires once release preparation has bumped a package into a breaking
  # version, so a branch whose packages are still at their old versions lints
  # clean while the release it produces does not. Running the release
  # preparation locally applies the version bumps, then lints the result, so
  # that mismatch fails on the pull request that introduces it instead of on
  # `main` after the release PR has merged.
  #
  # Nothing here is pushed: no push, no tags, no GitHub release object.
  release-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install NPM dependencies
        run: pnpm install --frozen-lockfile
      - name: shadow the nix-profile pnpm with the action-setup pnpm
        run: |
          # The nix-profile pnpm cannot run on Ubuntu runners (glibc
          # mismatch); the action-setup pnpm can. The shim is prepended to
          # PATH inside the devenv-shell steps below.
          system_pnpm="$(command -v pnpm)"
          test -n "$system_pnpm"
          mkdir -p /tmp/pnpm-shim
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$system_pnpm" > /tmp/pnpm-shim/pnpm
          chmod +x /tmp/pnpm-shim/pnpm
      - uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: configure git identity for the local release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: prepare the release locally (no push, no tags, no GitHub release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/tmp/pnpm-shim:$PATH"
          pnpm -v
          monochange run release --commit
        shell: devenv shell -- bash -e {0}
      - name: lint the release commit
        run: lint:all
        shell: devenv shell -- bash -e {0}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: test
        run: test:all
        shell: devenv shell -- bash -e {0}

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Start SurfPool and run integration tests
        run: test:integration
        shell: devenv shell -- bash -e {0}

  android-plugin-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action defaults to `packages: tools platform-tools`, but Google
          # has removed `tools` from its SDK repository, so the default request
          # fails with "Failed to find package 'tools'". The step below installs
          # every component the compile check needs, so only platform-tools is
          # requested here.
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Verify mobile wallet adapter Android compilation
        run: dart run scripts/check_mobile_wallet_adapter_android_compile.dart

  renderer-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/codama-renderers-dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: install Dart dependencies
        run: flutter pub get
        working-directory: .
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: build
        run: pnpm build
      - name: test
        run: pnpm test
      - name: test program artifact scripts
        run: >-
          node --experimental-test-module-mocks --test
          scripts/build_program_artifacts.test.mjs
          scripts/generate_program_packages.test.mjs
        working-directory: .

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install NPM dependencies
        run: pnpm install --frozen-lockfile
      - uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build NPM renderer package
        run: pnpm --filter codama-renderers-dart build
      - name: Validate package publish metadata
        run: monochange step publish-packages --dry-run --all --format json
        shell: devenv shell -- bash -e {0}

  coverage:
    runs-on: ubuntu-latest
    outputs:
      codecov-flags: ${{ steps.prepare-codecov-flags.outputs.flags }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install NPM dependencies
        run: pnpm install --frozen-lockfile
      - uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dart coverage
        run: test:coverage
        shell: devenv shell -- bash -e {0}
      - name: NPM renderer coverage
        run: |
          dart_bin_dir="$RUNNER_TEMP/devenv-dart-bin"
          mkdir -p "$dart_bin_dir"
          ln -s "$GITHUB_WORKSPACE/.devenv/profile/bin/dart" "$dart_bin_dir/dart"
          ln -s "$GITHUB_WORKSPACE/.devenv/profile/bin/flutter" "$dart_bin_dir/flutter"
          ln -s "$GITHUB_WORKSPACE/.devenv/profile/bin/fvm" "$dart_bin_dir/fvm"
          PATH="$dart_bin_dir:$PATH" pnpm --filter codama-renderers-dart test:coverage
      - name: prepare Codecov flag reports
        id: prepare-codecov-flags
        run: dart run scripts/prepare_codecov_flags.dart --lcov coverage/lcov.info --out-dir coverage/flags --github-output "$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}
      - name: upload Codecov flag reports artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-flag-reports
          path: coverage/flags/*.lcov
          if-no-files-found: error
          retention-days: 7
      - name: upload coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: ./coverage/lcov.info,./packages/codama-renderers-dart/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          name: solana-kit-workspace
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          verbose: true

  coverage-flags:
    runs-on: ubuntu-latest
    needs: coverage
    if: ${{ needs.coverage.outputs.codecov-flags != '[]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flag: ${{ fromJson(needs.coverage.outputs.codecov-flags) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: download Codecov flag reports artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codecov-flag-reports
          path: coverage/flags
      - name: upload package coverage flag to Codecov
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        # Flag posts are informational metadata, but Codecov's OIDC token
        # endpoint and upload API intermittently time out, and the action's
        # internal OIDC step fails the job regardless of fail_ci_if_error
        # (2026-09-13 main: "Failed to get ID Token" on codecs_strings).
        # Report generation and the primary upload stay gated by the
        # coverage job, so a flaky flag post must not red CI.
        continue-on-error: true
        with:
          files: ./coverage/flags/${{ matrix.flag }}.lcov
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ matrix.flag }}
          name: ${{ matrix.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          verbose: true

  release-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install NPM dependencies
        run: pnpm install --frozen-lockfile
      - name: shadow the nix-profile pnpm with the action-setup pnpm
        run: |
          # The nix-profile pnpm cannot run on Ubuntu runners (glibc
          # mismatch); the action-setup pnpm can. The shim is prepended to
          # PATH inside the devenv-shell steps below.
          system_pnpm="$(command -v pnpm)"
          test -n "$system_pnpm"
          mkdir -p /tmp/pnpm-shim
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$system_pnpm" > /tmp/pnpm-shim/pnpm
          chmod +x /tmp/pnpm-shim/pnpm
      - uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: configure git identity for the local release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: prepare the release locally (no push, no tags, no GitHub release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/tmp/pnpm-shim:$PATH"
          pnpm -v
          monochange run release --commit
        shell: devenv shell -- bash -e {0}
      - name: validate every package publishes (dry run)
        run: |
          export PATH="/tmp/pnpm-shim:$PATH"
          pnpm -v
          monochange run publish --dry-run
        shell: devenv shell -- bash -e {0}
